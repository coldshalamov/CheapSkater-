services:
  - type: web
    name: cheapskater-dashboard
    env: docker
    plan: starter
    healthCheckPath: /healthz
    startCommand: uvicorn app.dashboard:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CHEAPSKATER_DB_PATH
        value: /var/data/orwa_lowes.sqlite
      - key: CHEAPSKATER_SESSION_SECRET
        generateValue: true
      - key: CHEAPSKATER_INGEST_API_KEY
        value: JZhdARITo9ujVU2OcCaiqkx6ktB7SNh28ouQXz6U2f0=
      - key: PORT
        value: 8000
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM
        value: 93robingattis@gmail.com
      - key: SENDGRID_FROM_NAME
        value: GloorBot Deal Alerts
    disk:
      name: cheapskater-data
      mountPath: /var/data
      sizeGB: 1
