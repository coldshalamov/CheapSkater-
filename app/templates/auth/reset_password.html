{% extends "base.html" %}
{% block title %}Set New Password - Lowebot{% endblock %}
{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Set New Password</h1>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Choose a secure password for your account</p>
        </div>

        {% if error %}
        <div class="alert alert-error">
            <svg style="width: 20px; height: 20px; flex-shrink: 0;" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                    d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                    clip-rule="evenodd" />
            </svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="post" action="/auth/reset-password" class="auth-form">
            <input type="hidden" name="token" value="{{ token }}">

            <div class="form-group">
                <label for="password" class="form-label">New Password</label>
                <input type="password" id="password" name="password" required autocomplete="new-password"
                    placeholder="Min. 8 characters" class="form-input" minlength="8">
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                    autocomplete="new-password" placeholder="Confirm new password" class="form-input" minlength="8">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">Change Password</button>
        </form>

        <div style="margin-top: 2rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
            <a href="/auth/login" style="font-weight: 600; color: var(--accent-blue);">Back to Sign In</a>
        </div>
    </div>
</section>
{% endblock %}
