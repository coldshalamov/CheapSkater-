{% extends "base.html" %}
{% block title %}Sign In - GloorBot{% endblock %}
{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Welcome Back</h1>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Sign in to your GloorBot account</p>
        </div>

        {% if error %}
        <div class="alert alert-error">
            <svg style="width: 20px; height: 20px; flex-shrink: 0;" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                    d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                    clip-rule="evenodd" />
            </svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="post" action="/auth/login" class="auth-form">
            <input type="hidden" name="next_url" value="{{ next_url or '/' }}">

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com"
                    class="form-input">
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
                    <a href="/auth/forgot-password"
                        style="font-size: 0.875rem; color: var(--accent-blue); text-decoration: none;">Forgot
                        password?</a>
                </div>
                <input type="password" id="password" name="password" required autocomplete="current-password"
                    placeholder="••••••••" class="form-input">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
        </form>

        <div style="margin-top: 2rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? <a href="/auth/register"
                style="font-weight: 600; color: var(--accent-blue);">Register here</a>
        </div>
    </div>
</section>
{% endblock %}
