# Florida Lowe's Scraper Configuration
# This configuration is for scraping Florida stores (Stuart to Miami region)

retailers:
  lowes:
    enabled: true
    # Florida ZIP codes (Stuart to Miami)
    zips:
      # Martin County
      - "34994"  # Stuart
      # Palm Beach County
      - "33409"  # West Palm Beach
      - "33403"  # Lake Park
      - "33411"  # Royal Palm Beach
      - "33426"  # Boynton Beach
      - "33428"  # Boca Raton
      # Broward County
      - "33069"  # Pompano Beach
      - "33065"  # Coral Springs
      - "33334"  # Oakland Park
      - "33323"  # Sunrise
      - "33027"  # Pembroke Pines
      - "33331"  # Southwest Ranches
      - "33324"  # Davie
      # Miami-Dade County
      - "33016"  # Hialeah (NW)
      - "33012"  # Hialeah
      - "33162"  # North Miami Beach
      - "33186"  # Miami (Kendall)
      - "33033"  # Homestead
    
    # Use the same catalog as WA/OR
    catalog_path: "catalog/building_materials.lowes.yml"

output:
  # Use the same database - region field keeps data separate
  sqlite_path: "orwa_lowes.sqlite"
  csv_path: "outputs/florida_items.csv"

# Scrape every 3 hours (same as WA/OR)
schedule:
  minutes: 180

# Alert thresholds
alerts:
  pct_drop: 0.25
  abs_thresholds: {}

# Material keywords for filtering
material_keywords:
  - "roofing"
  - "drywall"
  - "sheetrock"
  - "insulation"
  - "lumber"
  - "plywood"
  - "flooring"
  - "tile"
  - "deck"
  - "fence"
  - "concrete"
  - "cement"
  - "mortar"
  - "siding"
  - "trim"
  - "moulding"
  - "plumbing"
  - "electrical"
  - "hardware"
  - "tool"
  - "back aisle"

# Quarantine retention
quarantine_retention_days: 7

# Health check URL (optional)
healthcheck_url: ""

# Keep concurrency low to reduce detection risk
max_concurrency: 1
